[project]
name = "good-morning-sweep"
version = "0.1.0"
description = "Free a phone's storage of WhatsApp forwards, copies and mistakes, with a local open model (Gemma 4) and a review"
requires-python = ">=3.10"
dependencies = ["pillow>=10", "numpy>=1.24"]
license = {text = "MIT"}

[project.scripts]
sweep = "sweep.cli:main"

[tool.setuptools]
packages = ["sweep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
